<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnyBank - Seu Banco Digital</title>

    <link rel="icon" type="image/png" href="assets/images/Favicon.png?v=1">

    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <div class="header-left">
            <div class="logo-container">
                <picture>
                    <source media="(min-width: 1024px)" srcset="assets/images/logo-desktop.svg">
                    <source media="(min-width: 768px)" srcset="assets/images/logo-tablet.png">
                    <img src="assets/images/logo-mobile.png" alt="AnyBank Logo">
                </picture>
            </div>
            <a href="#" class="nav-link">Sobre</a>
        </div>

        <div class="search-bar">
            <input type="text" placeholder="Busque aqui">
        </div>

        <div class="header-buttons">
            <a href="pages/cadastro/index.html" class="btn-open-account">Abrir conta</a>
            <a href="pages/login/index.html" class="btn-login-nav">Login</a>
        </div>
    </header>

    <main class="hero-container">
        <section class="hero-content">
            <h1>O banco digital que move o seu futuro.</h1>
            <p class="text-l hero-subtitle">Abra sua conta corrente em menos de 5 minutos, sem burocracia, sem taxas escondidas e com a segurança que você merece.</p>
            
            <div class="hero-cta-buttons">
                <a href="pages/cadastro/index.html" class="btn-cta-primary">Começar Agora</a>
                <a href="pages/login/index.html" class="btn-cta-secondary">Acessar Conta</a>
            </div>
        </section>

        <div class="hero-image">
            <picture>
                <source media="(min-width: 1024px)" srcset="assets/images/imagem-cadastro-desktop.png">
                <source media="(min-width: 768px)" srcset="assets/images/imagem-cadastro-tablet.png">
                <img src="assets/images/imagem-cadastro-mobile.png" alt="Conectado ao AnyBank">
            </picture>
        </div>
    </main>

</body>
</html>
