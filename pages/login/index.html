<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnyBank - Login</title>
    <link rel="stylesheet" href="../../assets/css/global.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <div class="header-left">
            <div class="logo-container">
                <picture>
                    <source media="(min-width: 1024px)" srcset="../../assets/images/logo-desktop.svg">
                    <source media="(min-width: 768px)" srcset="../../assets/images/logo-tablet.png">
                    <img src="../../assets/images/logo-mobile.png" alt="AnyBank Logo">
                </picture>
            </div>
            <a href="#" class="nav-link">Sobre</a>
        </div>

        <div class="search-bar">
            <input type="text" placeholder="Busque aqui">
        </div>

        <div class="header-buttons">
            <a href="../cadastro/index.html" class="btn-open-account">Abrir conta</a>
            <a href="#" class="btn-login-nav">Login</a>
        </div>
    </header>

    <main class="main-container">
        <div class="card-login">
            
            <div class="image-section">
                <picture>
                    <source media="(min-width: 1024px)" srcset="../../assets/images/imagem-login-desktop.png">
                    <source media="(min-width: 768px)" srcset="../../assets/images/imagem-login-tablet.png">
                    <img src="../../assets/images/imagem-login-mobile.png" alt="Homem a usar o notebook">
                </picture>
            </div>

            <div class="form-section">
                <h2>Login</h2>
                <p class="form-subtitle">Preencha os dados do login.</p>

                <form action="../dashboard/index.html" method="POST">
                    <div class="input-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="Digite seu e-mail" required>
                    </div>

                    <div class="input-group">
                        <label for="password">Senha</label>
                        <input type="password" id="password" placeholder="******" required>
                    </div>

                    <a href="#" class="forgot-password">Esqueci minha senha</a>

                    <label class="checkbox-container">
                        <input type="checkbox" required>
                        <span>Li e estou ciente quanto a Política de Privacidade.</span>
                    </label>

                    <button type="submit" class="btn-submit">Entrar</button>
                </form>
            </div>

        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
